<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Polaris Wellbeing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#1A2E35',
                            teal: '#2D7F87',
                            gold: '#C5A059',
                            cream: '#F9F7F2',
                            slate: '#4A5568',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-cream/20 font-sans">
    <nav class="fixed top-0 left-0 right-0 z-[100] bg-white/80 backdrop-blur-md border-b border-brand-slate/5">
        <div class="mx-auto max-w-7xl px-6 lg:px-8 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="h-10 w-10 bg-brand-navy rounded-xl flex items-center justify-center">
                    <i data-lucide="compass" class="text-brand-gold h-6 w-6"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-display font-bold text-brand-navy leading-none tracking-tight">POLARIS</span>
                    <span class="text-[10px] font-bold text-brand-teal uppercase tracking-[0.2em] mt-1">Wellbeing Visits</span>
                </div>
            </a>
            <div class="hidden lg:flex items-center gap-8 text-sm font-bold text-brand-navy uppercase tracking-widest">
                <a href="index.html" class="hover:text-brand-teal">Home</a>
                <a href="about.html" class="hover:text-brand-teal">About</a>
                <a href="services.html" class="hover:text-brand-teal">Services</a>
                <a href="pricing.html" class="hover:text-brand-teal">Pricing</a>
                <a href="contact.html" class="text-brand-teal">Contact</a>
            </div>
        </div>
    </nav>

    <div class="pt-32 min-h-screen bg-brand-cream/30">
        <section class="py-32 bg-white border-b border-brand-slate/10 text-center">
            <h1 class="text-5xl lg:text-7xl font-display font-bold text-brand-navy">Contact <span class="text-brand-teal italic">Us</span></h1>
            <p class="mt-8 text-xl text-brand-navy/70 max-w-2xl mx-auto">Supporting independence at home while giving families peace of mind. We're here to help.</p>
        </section>

        <section class="py-24 mx-auto max-w-7xl px-6 lg:px-8">
            <div class="grid lg:grid-cols-2 gap-24">
                <div class="space-y-12">
                    <h2 class="text-3xl font-bold text-brand-navy">Get in Touch</h2>
                    <div class="space-y-8">
                        <div class="flex gap-6 items-center">
                            <div class="bg-brand-navy/5 p-4 rounded-xl text-brand-teal"><i data-lucide="phone"></i></div>
                            <div><p class="text-xs font-bold uppercase tracking-widest text-brand-slate">Call us</p><p class="text-xl font-bold text-brand-navy">07592265774</p></div>
                        </div>
                        <div class="flex gap-6 items-center">
                            <div class="bg-brand-navy/5 p-4 rounded-xl text-brand-teal"><i data-lucide="mail"></i></div>
                            <div><p class="text-xs font-bold uppercase tracking-widest text-brand-slate">Email us</p><p class="text-lg font-bold text-brand-navy">polariswellbeingvisitsltd@gmail.com</p></div>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-12 rounded-[2.5rem] shadow-xl border border-brand-slate/10">
                    <form class="space-y-6">
                        <input type="text" placeholder="Your Name" class="w-full px-4 py-3 rounded-xl bg-brand-cream/10 border border-brand-slate/20 outline-none focus:ring-2 focus:ring-brand-teal">
                        <input type="tel" placeholder="Phone Number" class="w-full px-4 py-3 rounded-xl bg-brand-cream/10 border border-brand-slate/20 outline-none focus:ring-2 focus:ring-brand-teal">
                        <textarea rows="5" placeholder="Your Message" class="w-full px-4 py-3 rounded-xl bg-brand-cream/10 border border-brand-slate/20 outline-none focus:ring-2 focus:ring-brand-teal resize-none"></textarea>
                        <button class="w-full py-4 bg-brand-navy text-white rounded-xl font-bold hover:bg-brand-teal transition-all uppercase tracking-widest">SEND MESSAGE</button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
